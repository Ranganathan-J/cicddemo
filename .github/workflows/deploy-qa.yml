# .github/workflows/deploy-qa.yml
name: Deploy — QA

on:
  push:
    branches:
      - "featurebranch/**"
      - "fix/**"
      - "bugfix/**"
      - "hotfix/**"
      - "chore/**"
  workflow_dispatch:   # manual trigger as fallback

jobs:
  # ── Phase 1: Pre-Deploy Gates ─────────────────────────────────────────────────
  # Runs immediately on push. All quality gates must pass before QA deployment.
  pre-deploy:
    name: "Pre-Deploy Gates QA"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Black — Format check
        run: black --check .

      - name: isort — Import order check
        run: isort --check-only .

      - name: Flake8 — Lint check
        run: flake8 src/ tests/

      - name: MyPy — Type check
        run: mypy src/

      - name: Bandit — Security scan
        run: bandit -r src/ -ll

      - name: Pytest — Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=term-missing

      - name: Pre-Deploy Summary
        if: success()
        run: |
          echo "✅ All pre-deploy gates passed!"
          echo "   Branch      : ${{ github.ref_name }}"
          echo "   Commit      : ${{ github.sha }}"
          echo "   Triggered by: ${{ github.actor }}"
          echo ""
          echo "🚦 Proceeding to QA deployment..."

  # ── Phase 2: Deploy to QA ─────────────────────────────────────────────────────
  # Runs automatically after pre-deploy passes. No approval needed.
  deploy-qa:
    name: "Deploy to QA"
    needs: pre-deploy
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deploy to QA
        run: |
          echo "🚀 Deploying to QA..."
          echo "   Branch      : ${{ github.ref_name }}"
          echo "   Commit      : ${{ github.sha }}"
          echo "   Triggered by: ${{ github.actor }}"
          echo "   Timestamp   : $(date -u)"
          echo ""
          echo "✅ QA deployment complete."
          # TODO: Replace with your real QA deploy command, e.g.:
          #   ssh user@qa-host "cd /app && git pull && systemctl restart app"

      - name: Notify — Failure
        if: failure()
        run: echo "❌ QA deployment failed — review the logs above."

  # ── Phase 3: Post-Deploy QA Verification ─────────────────────────────────────
  # Runs automatically after QA deploy passes. Validates QA is healthy.
  # If this fails, open a PR to main is blocked by the broken QA state.
  post-deploy-qa:
    name: "Post-Deploy QA Verification"
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # ── Quality Gates ──────────────────────────────────────────
      - name: Black — Format check
        run: black --check .

      - name: isort — Import order check
        run: isort --check-only .

      - name: Flake8 — Lint check
        run: flake8 src/ tests/

      - name: MyPy — Type check
        run: mypy src/

      - name: Bandit — Security scan
        run: bandit -r src/ -ll

      - name: Pytest — Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=term-missing

      # ── Smoke Tests ────────────────────────────────────────────
      - name: Smoke Tests — QA
        run: |
          echo "🔍 Running smoke tests against QA..."
          if pytest tests/ -m smoke --co -q 2>/dev/null | grep -q "test session"; then
            pytest tests/ -m smoke -v
          else
            echo "ℹ️  No @pytest.mark.smoke tests found — running full suite as health check."
            pytest tests/ --tb=short
          fi

      - name: QA Verification Summary
        if: success()
        run: |
          echo "✅ QA verification passed!"
          echo "   Branch      : ${{ github.ref_name }}"
          echo "   Commit      : ${{ github.sha }}"
          echo ""
          echo "👉 QA is healthy. Open a PR to main to promote to Production."

      - name: QA Verification — Failure
        if: failure()
        run: |
          echo "❌ QA verification FAILED — fix issues before opening a PR to main."
