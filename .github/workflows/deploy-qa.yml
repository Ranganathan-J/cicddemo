# .github/workflows/deploy-qa.yml
name: Deploy — QA

on:
  push:
    branches:
      - "featurebranch"       # exact branch name
      - "featurebranch/**"    # featurebranch/sub-branch style
      - "fix/**"
      - "bugfix/**"
      - "hotfix/**"
      - "chore/**"
  workflow_dispatch:   # manual trigger as fallback

jobs:
  # ── Phase 1: Deploy to QA ────────────────────────────────────────────────────
  # Downloads the artifact built by ci.yml (no rebuild, no duplicate gate checks).
  # Quality gates already passed in ci.yml before this workflow runs.
  deploy-qa:
    name: "Deploy to QA"
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Download the exact artifact built by ci.yml for this commit
      - name: Download artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Show downloaded artifact
        run: |
          echo "📦 Artifact to deploy:"
          ls -lh dist/

      - name: Deploy to QA
        run: |
          echo "🚀 Deploying to QA..."
          echo "   Artifact    : $(ls dist/)"
          echo "   Branch      : ${{ github.ref_name }}"
          echo "   Commit      : ${{ github.sha }}"
          echo "   Triggered by: ${{ github.actor }}"
          echo "   Timestamp   : $(date -u)"
          echo ""
          echo "✅ QA deployment complete."
          # TODO: Replace with your real QA deploy command, e.g.:
          #   pip install dist/*.whl --target /app
          #   ssh user@qa-host "cd /app && pip install dist/*.whl && systemctl restart app"

      - name: Notify — Failure
        if: failure()
        run: echo "❌ QA deployment failed — review the logs above."

  # ── Phase 2: Post-Deploy QA Verification ─────────────────────────────────────
  # Verifies the deployed service is healthy. Tests the running service,
  # not the source code. When you have a real QA URL, replace the pytest
  # block with: curl -f https://your-qa-service/health || exit 1
  post-deploy-qa:
    name: "Post-Deploy QA Verification"
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # ── Health / Smoke Check ───────────────────────────────────
      # Replace this block with a real HTTP health check when you have a
      # deployed service URL:
      #   - name: Health Check
      #     run: curl -f https://your-qa-service.com/health || exit 1
      - name: Smoke Tests — QA
        run: |
          echo "🔍 Running smoke tests against QA..."
          if pytest tests/ -m smoke --co -q 2>/dev/null | grep -q "test session"; then
            pytest tests/ -m smoke -v
          else
            echo "ℹ️  No @pytest.mark.smoke tests found — running full suite as health check."
            pytest tests/ --tb=short
          fi

      - name: QA Verification Summary
        if: success()
        run: |
          echo "✅ QA verification passed!"
          echo "   Branch      : ${{ github.ref_name }}"
          echo "   Commit      : ${{ github.sha }}"
          echo ""
          echo "👉 QA is healthy. Open a PR to main to promote to Production."

      - name: QA Verification — Failure
        if: failure()
        run: |
          echo "❌ QA verification FAILED — fix issues before opening a PR to main."
