# .github/workflows/deploy-qa.yml
name: Deploy — QA

on:
  push:
    branches:
      - "featurebranch"       # exact branch name
      - "featurebranch/**"    # featurebranch/sub-branch style
      - "fix/**"
      - "bugfix/**"
      - "hotfix/**"
      - "chore/**"
  workflow_dispatch:   # manual trigger as fallback

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage: DEPLOY
  # Checks out the exact commit, builds the wheel, and deploys to QA.
  # Quality gates already passed in ci.yml — no duplication here.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  deploy-qa:
    name: "Stage: Deploy to QA"
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build wheel
        run: python -m build --wheel --outdir dist/

      - name: Show built artifact
        run: |
          echo "📦 Built artifact:"
          ls -lh dist/

      - name: Deploy to QA
        run: |
          echo "🚀 Deploying to QA..."
          echo "   Artifact    : $(ls dist/)"
          echo "   Branch      : ${{ github.ref_name }}"
          echo "   Commit      : ${{ github.sha }}"
          echo "   Triggered by: ${{ github.actor }}"
          echo "   Timestamp   : $(date -u)"
          echo ""
          echo "✅ QA deployment complete."
          # TODO: Replace with your real QA deploy command, e.g.:
          #   pip install dist/*.whl --target /app
          #   ssh user@qa-host "pip install dist/*.whl && systemctl restart app"

      - name: Notify — Failure
        if: failure()
        run: echo "❌ QA deployment failed — review the logs above."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage: POST-DEPLOY
  # Verifies QA is healthy after deployment. Tests the running service,
  # not the source code quality (gates already ran in ci.yml).
  # When you have a real QA URL, replace the pytest block with:
  #   curl -f https://your-qa-service/health || exit 1
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  post-deploy-qa:
    name: "Stage: Post-Deploy QA Verification"
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # ── Health / Smoke Check ───────────────────────────────────
      - name: Smoke Tests — QA
        run: |
          echo "🔍 Running smoke tests against QA..."
          if pytest tests/ -m smoke --co -q 2>/dev/null | grep -q "test session"; then
            pytest tests/ -m smoke -v
          else
            echo "ℹ️  No @pytest.mark.smoke tests found — running full suite as health check."
            pytest tests/ --tb=short
          fi

      - name: QA Verification Summary
        if: success()
        run: |
          echo "✅ QA verification passed!"
          echo "   Branch      : ${{ github.ref_name }}"
          echo "   Commit      : ${{ github.sha }}"
          echo ""
          echo "👉 QA is healthy. Open a PR to main to promote to Production."

      - name: QA Verification — Failure
        if: failure()
        run: |
          echo "❌ QA verification FAILED — fix issues before opening a PR to main."
