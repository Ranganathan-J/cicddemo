# .github/workflows/ci.yml
name: CI — Code Quality & Tests

on:
  push:
    branches:
      - main
      - "featurebranch"
      - "featurebranch/**"
      - "fix/**"
      - "bugfix/**"
      - "hotfix/**"
      - "chore/**"
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality Gates
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Python Setup ──────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Cache pip dependencies ─────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── Install tools ──────────────────────────────────────────
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # ── Gate 1: Black ─────────────────────────────────────────
      - name: Black — Format check
        run: black --check .

      # ── Gate 2: isort ─────────────────────────────────────────
      - name: isort — Import order check
        run: isort --check-only .

      # ── Gate 3: Flake8 ────────────────────────────────────────
      - name: Flake8 — Lint check
        run: flake8 src/ tests/

      # ── Gate 4: MyPy ──────────────────────────────────────────
      - name: MyPy — Type check
        run: mypy src/

      # ── Gate 5: Bandit ────────────────────────────────────────
      - name: Bandit — Security scan
        run: bandit -r src/ -ll   # flag only medium+ severity

      # ── Tests ─────────────────────────────────────────────────
      - name: Pytest — Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=term-missing

  # ── Build artifact (built once, promoted through environments) ──
  # Deploy jobs download this exact artifact — nothing is rebuilt later.
  build:
    name: Build Artifact
    needs: quality             # only runs if all quality gates pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tool
        run: pip install build

      - name: Build wheel
        run: python -m build --wheel --outdir dist/

      - name: Show built artifact
        run: |
          echo "📦 Built artifact:"
          ls -lh dist/

      # Upload so deploy jobs can download the exact same wheel
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ── Upload coverage report ─────────────────────────────────────
  coverage:
    name: Upload Coverage
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ --cov=src --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
