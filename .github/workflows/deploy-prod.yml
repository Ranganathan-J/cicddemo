# .github/workflows/deploy-prod.yml
name: Deploy — Production

on:
  push:
    branches:
      - main          # fires automatically when a PR is merged into main
  workflow_dispatch:  # manual trigger as fallback

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage: DEPLOY
  # Checks out the exact merged commit, builds the wheel, and deploys.
  # Quality gates already passed in ci.yml on the PR — no duplication here.
  # If 'Required Reviewers' is set on the 'production' environment in
  # Settings → Environments → production, GitHub pauses here for approval.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  deploy-prod:
    name: "Stage: Deploy to Production"
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Build wheel
        run: python -m build --wheel --outdir dist/

      - name: Show built artifact
        run: |
          echo "📦 Built artifact:"
          ls -lh dist/

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to Production..."
          echo "   Artifact    : $(ls dist/)"
          echo "   Branch      : ${{ github.ref_name }}"
          echo "   Commit      : ${{ github.sha }}"
          echo "   Triggered by: ${{ github.actor }}"
          echo "   Timestamp   : $(date -u)"
          echo ""
          echo "✅ Production deployment complete."
          # TODO: Replace with your real Production deploy command, e.g.:
          #   pip install dist/*.whl --target /app
          #   ssh user@prod-host "pip install dist/*.whl && systemctl restart app"

      - name: Notify — Success
        if: success()
        run: |
          echo "🎉 Production deployment succeeded!"
          echo "🚦 Proceeding to post-deploy verification..."

      - name: Notify — Failure
        if: failure()
        run: echo "❌ Production deployment failed — review the logs above."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage: POST-DEPLOY
  # Verifies Production is healthy. Runs automatically after deploy-prod passes.
  # When you have a real Production URL, replace the pytest block with:
  #   curl -f https://your-prod-service.com/health || exit 1
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  post-deploy-prod:
    name: "Stage: Post-Deploy Production Verification"
    needs: deploy-prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # ── Health / Smoke Check ───────────────────────────────────
      - name: Smoke Tests — Production
        run: |
          echo "🔍 Running smoke tests against Production..."
          if pytest tests/ -m smoke --co -q 2>/dev/null | grep -q "test session"; then
            pytest tests/ -m smoke -v
          else
            echo "ℹ️  No @pytest.mark.smoke tests found — running full suite as health check."
            pytest tests/ --tb=short
          fi

      - name: Production Verification Summary
        if: success()
        run: |
          echo "✅ Production verification passed!"
          echo "   Branch      : ${{ github.ref_name }}"
          echo "   Commit      : ${{ github.sha }}"
          echo "   Triggered by: ${{ github.actor }}"
          echo "   Timestamp   : $(date -u)"

      - name: Production Verification — Failure
        if: failure()
        run: |
          echo "❌ Production smoke tests FAILED!"
          echo "   Investigate immediately — consider rolling back the deployment."
          echo ""
          echo "🔄 Rollback steps:"
          echo "   1. Find the last stable tag: git tag -l | sort -V | tail -5"
          echo "   2. Redeploy from that tag's commit"
          echo "   # TODO: Add your real rollback command here"

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stage: RELEASE
  # Creates a Git tag (v<run_number>) on every successful Production deployment.
  # Gives a clear audit trail: which run number = which production release.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  tag-release:
    name: "Stage: Tag Release"
    needs: post-deploy-prod
    runs-on: ubuntu-latest
    permissions:
      contents: write           # required to push tags to the repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history needed to push tags

      - name: Create and push release tag
        run: |
          TAG="v${{ github.run_number }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Production release $TAG — commit ${{ github.sha }}"
          git push origin "$TAG"
          echo "🏷️  Tagged release: $TAG"
          echo "🏁 Full QA → Production pipeline complete."
