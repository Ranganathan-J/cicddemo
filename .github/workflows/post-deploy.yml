# .github/workflows/post-deploy.yml
name: Phase 3 — Post-Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - staging
          - production

jobs:
  post-deploy:
    name: Post-Deploy Smoke Tests
    runs-on: ubuntu-latest

    # References the same production environment for audit trail —
    # GitHub tracks this run under the production environment history.
    environment: production

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Python Setup ──────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Cache pip dependencies ─────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── Install tools ──────────────────────────────────────────
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # ── Smoke / Integration Tests ──────────────────────────────
      # Runs tests marked with @pytest.mark.smoke if they exist,
      # otherwise falls back to running the full test suite as a
      # health check against the deployed code.
      - name: Smoke Tests
        run: |
          echo "🔍 Running post-deploy smoke tests against: ${{ inputs.environment }}"
          if pytest tests/ -m smoke --co -q 2>/dev/null | grep -q "test session"; then
            pytest tests/ -m smoke -v
          else
            echo "ℹ️  No @pytest.mark.smoke tests found — running full test suite as health check."
            pytest tests/ --tb=short
          fi

      # ── Summary ───────────────────────────────────────────────
      - name: Post-Deploy Summary
        if: success()
        run: |
          echo "✅ Post-deploy verification passed!"
          echo "   Environment : ${{ inputs.environment }}"
          echo "   Branch      : ${{ github.ref_name }}"
          echo "   Commit      : ${{ github.sha }}"
          echo "   Triggered by: ${{ github.actor }}"
          echo "   Timestamp   : $(date -u)"
          echo ""
          echo "🏁 Deployment pipeline complete."

      - name: Post-Deploy Summary — Failure
        if: failure()
        run: |
          echo "❌ Post-deploy smoke tests FAILED on ${{ inputs.environment }}!"
          echo "   Consider rolling back the deployment."
