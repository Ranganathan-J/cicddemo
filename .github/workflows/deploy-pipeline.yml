# .github/workflows/deploy-pipeline.yml
name: Deploy Pipeline — QA → Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for deployment (optional)"
        required: false
        default: ""
        type: string

jobs:
  # ── Phase 1: Pre-Deploy ───────────────────────────────────────────────────────
  # Runs immediately on trigger. All quality gates must pass before anything
  # is deployed to any environment.
  pre-deploy:
    name: "Phase 1 — Pre-Deploy Gates"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # ── Quality Gates ──────────────────────────────────────────
      - name: Black — Format check
        run: black --check .

      - name: isort — Import order check
        run: isort --check-only .

      - name: Flake8 — Lint check
        run: flake8 src/ tests/

      - name: MyPy — Type check
        run: mypy src/

      - name: Bandit — Security scan
        run: bandit -r src/ -ll

      - name: Pytest — Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=term-missing

      - name: Pre-Deploy Summary
        if: success()
        run: |
          echo "✅ All pre-deploy gates passed!"
          echo "   Branch      : ${{ github.ref_name }}"
          echo "   Commit      : ${{ github.sha }}"
          echo "   Triggered by: ${{ github.actor }}"
          echo "   Reason      : ${{ inputs.reason || 'Not specified' }}"
          echo ""
          echo "🚦 Proceeding automatically to QA deployment..."

  # ── Phase 2: Deploy to QA ─────────────────────────────────────────────────────
  # Runs automatically after pre-deploy passes.
  # 'qa' environment has NO Required Reviewers — no approval needed.
  deploy-qa:
    name: "Phase 2 — Deploy to QA"
    needs: pre-deploy
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deploy to QA
        run: |
          echo "🚀 Deploying to QA..."
          echo "   Branch      : ${{ github.ref_name }}"
          echo "   Commit      : ${{ github.sha }}"
          echo "   Triggered by: ${{ github.actor }}"
          echo "   Timestamp   : $(date -u)"
          echo ""
          echo "✅ QA deployment complete."
          # TODO: Replace with your real QA deploy command, e.g.:
          #   ssh user@qa-host "cd /app && git pull && systemctl restart app"

      - name: Notify — Failure
        if: failure()
        run: echo "❌ QA deployment failed — review the logs above."

  # ── Phase 3: Post-Deploy QA ───────────────────────────────────────────────────
  # Runs automatically after QA deploy passes.
  # Verifies QA is healthy before allowing Production promotion.
  post-deploy-qa:
    name: "Phase 3 — Post-Deploy QA Verification"
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # ── Quality Gates ──────────────────────────────────────────
      - name: Black — Format check
        run: black --check .

      - name: isort — Import order check
        run: isort --check-only .

      - name: Flake8 — Lint check
        run: flake8 src/ tests/

      - name: MyPy — Type check
        run: mypy src/

      - name: Bandit — Security scan
        run: bandit -r src/ -ll

      - name: Pytest — Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=term-missing

      # ── Smoke Tests ────────────────────────────────────────────
      - name: Smoke Tests — QA
        run: |
          echo "🔍 Running smoke tests against QA..."
          if pytest tests/ -m smoke --co -q 2>/dev/null | grep -q "test session"; then
            pytest tests/ -m smoke -v
          else
            echo "ℹ️  No @pytest.mark.smoke tests found — running full suite as health check."
            pytest tests/ --tb=short
          fi

      - name: QA Verification Summary
        if: success()
        run: |
          echo "✅ QA verification passed!"
          echo "   Branch      : ${{ github.ref_name }}"
          echo "   Commit      : ${{ github.sha }}"
          echo ""
          echo "⏸  Waiting for manual approval to promote to Production..."

      - name: QA Verification — Failure
        if: failure()
        run: |
          echo "❌ QA verification FAILED — Production promotion blocked."

  # ── Phase 4: Deploy to Production ────────────────────────────────────────────
  # *** ONE APPROVAL GATE ***
  # Blocked until QA verification passes. GitHub then pauses and shows
  # "Waiting for review" — a reviewer must approve before deploy runs.
  # Enable Required Reviewers on the 'production' environment:
  #   Settings → Environments → production → Required Reviewers
  deploy-prod:
    name: "Phase 4 — Deploy to Production"
    needs: post-deploy-qa
    runs-on: ubuntu-latest
    environment: production             # ← THE approval gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to Production..."
          echo "   Branch      : ${{ github.ref_name }}"
          echo "   Commit      : ${{ github.sha }}"
          echo "   Triggered by: ${{ github.actor }}"
          echo "   Timestamp   : $(date -u)"
          echo ""
          echo "✅ Production deployment complete."
          # TODO: Replace with your real Production deploy command, e.g.:
          #   ssh user@prod-host "cd /app && git pull && systemctl restart app"

      - name: Notify — Success
        if: success()
        run: |
          echo "🎉 Production deployment succeeded!"
          echo "🚦 Proceeding automatically to post-deploy verification..."

      - name: Notify — Failure
        if: failure()
        run: echo "❌ Production deployment failed — review the logs above."

  # ── Phase 5: Post-Deploy Production ──────────────────────────────────────────
  # Runs automatically after Production deploy passes. No approval needed.
  # Verifies Production is healthy after the deployment.
  post-deploy-prod:
    name: "Phase 5 — Post-Deploy Production Verification"
    needs: deploy-prod
    runs-on: ubuntu-latest
    # No 'environment:' tag — runs automatically without triggering another approval gate.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # ── Quality Gates ──────────────────────────────────────────
      - name: Black — Format check
        run: black --check .

      - name: isort — Import order check
        run: isort --check-only .

      - name: Flake8 — Lint check
        run: flake8 src/ tests/

      - name: MyPy — Type check
        run: mypy src/

      - name: Bandit — Security scan
        run: bandit -r src/ -ll

      - name: Pytest — Run tests with coverage
        run: pytest tests/ --cov=src --cov-report=term-missing

      # ── Smoke Tests ────────────────────────────────────────────
      - name: Smoke Tests — Production
        run: |
          echo "🔍 Running smoke tests against Production..."
          if pytest tests/ -m smoke --co -q 2>/dev/null | grep -q "test session"; then
            pytest tests/ -m smoke -v
          else
            echo "ℹ️  No @pytest.mark.smoke tests found — running full suite as health check."
            pytest tests/ --tb=short
          fi

      - name: Production Verification Summary
        if: success()
        run: |
          echo "✅ Production verification passed!"
          echo "   Branch      : ${{ github.ref_name }}"
          echo "   Commit      : ${{ github.sha }}"
          echo "   Triggered by: ${{ github.actor }}"
          echo "   Timestamp   : $(date -u)"
          echo ""
          echo "🏁 Full QA → Production deployment pipeline complete."

      - name: Production Verification — Failure
        if: failure()
        run: |
          echo "❌ Production smoke tests FAILED!"
          echo "   Investigate immediately — consider rolling back the deployment."
